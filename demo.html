<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="bg-dark text-white p-3" style="width: 250px; height: 100vh;">
            <h4 class="text-center">Dashboard</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="dashboard.html" class="nav-link text-white"><i class="fa-solid fa-house mx-2"></i>Home</a></li>
                <li class="nav-item"><a href="statistics.html" class="nav-link text-white"><i class="fa-solid fa-chart-simple mx-2"></i>Statistics</a></li>
                <li class="nav-item"><a href="users.html" class="nav-link text-white"><i class="fa-solid fa-users mx-2"></i>Users</a></li>
                <li class="nav-item"><a href="reports.html" class="nav-link text-white"><i class="fa-solid fa-file-alt mx-2"></i>Reports</a></li>
            </ul>
        </nav>
        
        <!-- Main Content -->
        <div class="container-fluid p-4">
            <h2 class="mb-4">Welcome to the Travel Agency Dashboard</h2>
            <div class="row">
                <div class="col-md-6">
                    <div class="card p-3">
                        <h5>Travel Machine Status</h5>
                        <p><span class="text-success">6 Active</span>, <span class="text-danger">3 Inactive</span></p>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card p-3">
                        <h5>Messages</h5>
                        <p><i class="fa-solid fa-comments mx-2"></i> 10 New Messages</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
