            <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4 main-content">

                <div class="feedback-categories d-flex flex-wrap justify-content-center my-4">
                    <button class="btn btn-outline-primary mx-1 my-1 col-12 col-sm-4 col-md-2" style="border-radius: 30px;" onclick="showFeedback(5)">
                        <i class="fas fa-star"></i> 5 Stars
                    </button>
                    <button class="btn btn-outline-success mx-1 my-1 col-12 col-sm-4 col-md-2" style="border-radius: 30px;" onclick="showFeedback(4)">
                        <i class="fas fa-star"></i> 4 Stars
                    </button>
                    <button class="btn btn-outline-info mx-1 my-1 col-12 col-sm-4 col-md-2" style="border-radius: 30px;" onclick="showFeedback(3)">
                        <i class="fas fa-star"></i> 3 Stars
                    </button>
                    <button class="btn btn-outline-warning mx-1 my-1 col-12 col-sm-4 col-md-2" style="border-radius: 30px;" onclick="showFeedback(2)">
                        <i class="fas fa-star"></i> 2 Stars
                    </button>
                    <button class="btn btn-outline-danger mx-1 my-1 col-12 col-sm-4 col-md-2" style="border-radius: 30px;" onclick="showFeedback(1)">
                        <i class="fas fa-star"></i> 1 Star
                    </button>
                    <button class="btn btn-outline-secondary mx-1 my-1 col-12 col-sm-4 col-md-2" style="border-radius: 30px;" onclick="showAllFeedback()">
                        <i class="fas fa-list"></i> All Feedbacks
                    </button>
                </div>
                
                

                <div id="feedback-list" class="row">
                    <!-- Feedbacks will be inserted here by JavaScript -->
                </div>
            </main>
        </div>
    

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // js/feedbacks.js
document.addEventListener("DOMContentLoaded", function() {
    // Sample feedback data
    const feedbackData = {
        5: [
            { name: "Jane Smith", feedback: "Had a wonderful experience.", rating: "★★★★★", img: "https://randomuser.me/api/portraits/women/1.jpg" },
        ],
        4: [
            { name: "John Doe", feedback: "Great service! Highly recommend.", rating: "★★★★☆", img: "https://randomuser.me/api/portraits/men/1.jpg" },
        ],
        3: [
            { name: "Mike Johnson", feedback: "Could improve on punctuality.", rating: "★★★☆☆", img: "https://randomuser.me/api/portraits/men/2.jpg" },
        ],
        2: [],
        1: []
    };

    // Function to show feedback based on rating
    window.showFeedback = function(rating) {
        const feedbackList = document.getElementById('feedback-list');
        feedbackList.innerHTML = '';

        if (feedbackData[rating].length === 0) {
            feedbackList.innerHTML = '<div class="col-12 list-group-item">No feedbacks available.</div>';
            return;
        }

        feedbackData[rating].forEach(feedback => {
            const feedbackItem = document.createElement('div');
            feedbackItem.className = 'col-md-6 col-lg-4 mb-4';
            feedbackItem.innerHTML = `
                <div class="card">
                    <div class="card-body d-flex">
                        <img src="${feedback.img}" alt="${feedback.name}" class="rounded-circle mr-3" width="50" height="50">
                        <div>
                            <h5>${feedback.name}</h5>
                            <p>${feedback.feedback}</p>
                            <small class="rating">${feedback.rating.split('').map(star => `<span>${star}</span>`).join('')}</small>
                            <div class="reply-section mt-2">
                                <textarea rows="2" placeholder="Write a reply..."></textarea>
                                <button class="btn btn-primary btn-sm mt-2">Reply</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            feedbackList.appendChild(feedbackItem);
        });
    }

    // Function to show all feedbacks
    window.showAllFeedback = function() {
        const feedbackList = document.getElementById('feedback-list');
        feedbackList.innerHTML = '';

        let allFeedbacks = [];
        for (const rating in feedbackData) {
            allFeedbacks = allFeedbacks.concat(feedbackData[rating]);
        }

        if (allFeedbacks.length === 0) {
            feedbackList.innerHTML = '<div class="col-12 list-group-item">No feedbacks available.</div>';
            return;
        }

        allFeedbacks.forEach(feedback => {
            const feedbackItem = document.createElement('div');
            feedbackItem.className = 'col-md-6 col-lg-4 mb-4';
            feedbackItem.innerHTML = `
                <div class="card">
                    <div class="card-body d-flex">
                        <img src="${feedback.img}" alt="${feedback.name}" class="rounded-circle mr-3" width="50" height="50">
                        <div>
                            <h5>${feedback.name}</h5>
                            <p>${feedback.feedback}</p>
                            <small class="rating">${feedback.rating.split('').map(star => `<span>${star}</span>`).join('')}</small>
                            <div class="reply-section mt-2">
                                <textarea rows="2" placeholder="Write a reply..."></textarea>
                                <button class="btn btn-primary btn-sm mt-2">Reply</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            feedbackList.appendChild(feedbackItem);
        });
    }

    // Show 5-star feedbacks by default
    showFeedback(5);
});
    </script>
